<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>매불쇼 신입 작가 생존기</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; }
  body { font-family: "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; color:#e8e8e8; cursor:none; }
  #app { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #overlay { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
             background:#05070a; transition:opacity .6s ease; }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #boot { text-align:center; letter-spacing:.4em; }
  #boot h1 { font-size:clamp(32px,7vw,86px); font-weight:800; letter-spacing:.18em; }
  #boot .sub { margin-top:14px; font-size:13px; opacity:.55; letter-spacing:.35em; }
  #bar { margin:34px auto 0; width:min(420px,60vw); height:2px; background:#1a1f26; }
  #bar > i { display:block; height:100%; width:0%; background:#c9a227; transition:width .25s ease; }
  #err { position:fixed; left:0; right:0; bottom:0; max-height:45%; overflow:auto; z-index:99;
         background:#2a0a0a; color:#ffb3b3; font:12px/1.5 ui-monospace,monospace; padding:10px; display:none; white-space:pre-wrap; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <div id="overlay"><div id="boot">
    <h1>매불쇼</h1>
    <div class="sub">신입 작가 생존기</div>
    <div id="bar"><i></i></div>
    <div class="sub" id="bootmsg" style="margin-top:18px;opacity:.35">스튜디오 준비 중</div>
  </div></div>
  <pre id="err"></pre>
<script type="importmap">
{ "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/webgpu": "/node_modules/three/build/three.webgpu.js",
    "three/tsl": "/node_modules/three/build/three.tsl.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
<script type="module">
  const err = document.getElementById('err');
  const show = (m) => { err.style.display='block'; err.textContent += m + '\n';
                        (window.__ERRORS ||= []).push(m); };
  window.addEventListener('error', e => show('[error] ' + (e.error?.stack || e.message)));
  window.addEventListener('unhandledrejection', e => show('[promise] ' + (e.reason?.stack || e.reason)));
  import('./src/main.js').catch(e => show('[boot] ' + (e.stack || e)));
</script>
</body>
</html>
